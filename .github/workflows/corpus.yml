name: Corpus stress-test
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit models (0=all)'
        required: false
        default: '100'
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [ main, "arena/**" ]
    paths:
      - 'tests/corpus/manifest.json'
      - 'tools/fetch_corpus.py'
      - 'tools/make_stress_report.py'
      - 'solver.py'

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: tests/corpus/cache
          key: corpus-${{ hashFiles('tests/corpus/manifest.json') }}
          restore-keys: corpus-
      - name: Install deps
        run: pip install -r requirements.txt && pip install pytest mapbox-earcut shapely
      - name: Fetch corpus
        run: python tools/fetch_corpus.py --limit 100
      - name: Make stress report shard ${{ matrix.shard }} (25 моделей, 16³→32³ 120с, 150k)
        run: python tools/make_stress_report.py --shard ${{ matrix.shard }} --num-shards 4
      - name: Rename shard artifact
        run: mv report.json report_shard_${{ matrix.shard }}.json && mv report.html report_shard_${{ matrix.shard }}.html || true
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: corpus-shard-${{ matrix.shard }}
          path: |
            report_shard_*.json
            report_shard_*.html
          retention-days: 14

  merge:
    needs: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: corpus-shard-*
          merge-multiple: true
          path: shards
      - name: Merge reports
        run: python tools/merge_reports.py
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            report.json
            report.html
            docs/CORPUS_REPORT.md
          retention-days: 14
