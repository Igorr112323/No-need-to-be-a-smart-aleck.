name: Hash v1.0.3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release download v1.0.3 --repo ${{ github.repository }} --pattern "OpenLight.exe" --dir /tmp --clobber
          ls -lh /tmp/OpenLight.exe
          SHA=$(sha256sum /tmp/OpenLight.exe | cut -d' ' -f1)
          SZ=$(stat -c%s /tmp/OpenLight.exe)
          SZM=$(numfmt --to=iec-i --suffix=B $SZ)
          cat > /tmp/body.md <<'EOF'
          OpenLight 1.0.3 — диагност 17D: --diag init.log, boot wrapper, WebView2 detect.

          **Что нового в 1.0.3:**
          - `OpenLight.exe --diag` → `%APPDATA%\OpenLight\logs\init.log` с таймштампами (версия, _MEIPASS/web, vendor, VERSION, APPDATA, WebView2)
          - `boot()` в index.html: `onerror`/`unhandledrejection` → `document.title='ERR: ...'` + маркеры `splash shown→web-loaded→js-ready→api-ready`
          - `pywebview debug=True` при --diag, API `diag_ping`/`diag_log_js`, события `loaded/shown`
          - Лог создаётся всегда при --diag, `--diag-headless` для Controlled Folder Access, --selftest сохранён

          **Что есть/чего нет:** как в 1.0.2 (корпус 86/100, МББ 1.8%, Кирш 2.5%, CalculiX 4.2%, офлайн, нет STEP/buckling, Лицензия MIT).

          См. README, docs/KNOWN_LIMITATIONS.md, LICENSE MIT. Версия из VERSION (`git describe --tags`, без хардкода), `OpenLight.exe --selftest` → `OpenLight 1.0.3`.
          EOF
          printf "\n---\n**SHA256:** \`%s\` — \`OpenLight.exe\` (%s, Build #%s)\nRelease: https://github.com/%s/releases/tag/v1.0.3\nПуть к логу: `%%APPDATA%%\\OpenLight\\logs\\init.log` (Windows) / `~/.config/OpenLight/logs/init.log` (Linux) — создаётся при `OpenLight.exe --diag`\n" "$SHA" "$SZM" "${{ github.run_id }}" "${{ github.repository }}" >> /tmp/body.md
          gh release edit v1.0.3 --repo ${{ github.repository }} --notes-file /tmp/body.md
          cat /tmp/body.md | tail -n 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
