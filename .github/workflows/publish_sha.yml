name: Publish SHA
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "OpenLight.exe" --dir /tmp --clobber
          ls -lh /tmp/OpenLight.exe
          SHA=$(sha256sum /tmp/OpenLight.exe | cut -d' ' -f1)
          echo "SHA256=$SHA"
          echo "$SHA  OpenLight.exe" > /tmp/SHA256.txt
          cat /tmp/SHA256.txt
          # update release notes to include SHA
          gh release view v1.0.0 --repo ${{ github.repository }} --json body --jq .body > /tmp/body.md
          cat /tmp/body.md | head -n 20
          # append SHA if not present
          if ! grep -q "$SHA" /tmp/body.md; then
            printf "\n---\n**SHA256:** \`%s\`  — \`OpenLight.exe\` (%s, Build #%s)\nRelease: https://github.com/%s/releases/tag/v1.0.0\n" "$SHA" "$(stat -c%s /tmp/OpenLight.exe | numfmt --to=iec-i --suffix=B 2>/dev/null || echo 85983232B)" "${{ github.run_id }}" "${{ github.repository }}" >> /tmp/body.md
            gh release edit v1.0.0 --repo ${{ github.repository }} --notes-file /tmp/body.md
            echo "updated release notes"
          fi
          gh release view v1.0.0 --repo ${{ github.repository }} --json body --jq .body | tail -n 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
