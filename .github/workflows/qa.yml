name: QA — статика/юнит + e2e headless
on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python deps
        run: pip install -r requirements.txt && pip install pytest mapbox-earcut shapely
      - name: Python compile
        run: python -m py_compile main.py solver.py build/vendor.py build/make_icon.py tools/fetch_corpus.py tools/make_stress_report.py tests/test_beam.py tests/test_solver.py tests/test_corpus.py tests/test_mbb.py tests/test_bracket_oc.py
      - name: Node check
        run: node --input-type=module --check < web/js/app.js && node --check web/js/state.js
      - name: Solver import smoke
        run: python -c "import solver; print(solver.MATERIALS)"
      - name: Beam etalon ≤2.5%
        run: pytest tests/test_beam.py -v --tb=short
      - name: Kirsch ≤7%
        run: pytest tests/test_kirsch.py -v --tb=short
      - name: Loadcases
        run: pytest tests/test_loadcases.py -v --tb=short
      - name: Solver smoke
        run: pytest tests/test_solver.py -v --tb=short -k "not corpus"
      - name: Bracket OC 16³
        run: pytest tests/test_bracket_oc.py -v --tb=short
      - name: MBB 60x20x1
        run: pytest tests/test_mbb.py -v --tb=short
      - name: UI lint — id сверка
        run: |
          python3 << 'PY'
          import re, pathlib
          html=pathlib.Path('web/index.html').read_text()
          js=pathlib.Path('web/js/app.js').read_text()+pathlib.Path('web/js/state.js').read_text()
          html_ids=set(re.findall(r'id="([^"]+)"', html))
          js_ids=set(re.findall(r'getElementById\([\'"]([^\'"]+)[\'"]\)', js)) | set(re.findall(r'querySelector\([\'"]#([^\'"]+)[\'"]', js))
          missing=sorted(js_ids-html_ids)
          print("HTML ids:", len(html_ids), "JS ids:", len(js_ids))
          print("Missing in HTML:", missing)
          assert not missing, f"ID-MISMATCH {missing}"
          PY
      - name: Overlay check
        run: |
          grep -q "pointer-events:none" web/css/app.css || (echo "overlay missing pointer-events:none" && exit 1)
          grep -q ".app-loader.hidden" web/css/app.css
          echo "overlay OK"
      - name: Placeholder check
        run: |
          ! grep -R "anev" web/index.html web/js/app.js || (echo "anev found" && exit 1)
          echo "placeholder OK"
      - name: Network check
        run: |
          if grep -rn "fetch(" web/ --exclude-dir=vendor | grep -v "common-3d-test-models" | grep -q "fetch("; then echo "fetch found in web/"; exit 1; fi
          echo "network OK"

  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest playwright Pillow trimesh scipy scikit-image mapbox-earcut shapely
          python -m playwright install --with-deps chromium
      - name: Start web server
        run: |
          nohup python -m http.server 8080 --directory web > /tmp/http.log 2>&1 &
          sleep 2
          curl -sI http://127.0.0.1:8080/index.html | head
          curl -s http://127.0.0.1:8080/index.html | grep -c "btnBack" && echo "html ok"
          python3 -c "from playwright.sync_api import sync_playwright; print('playwright import ok')"
          pytest tests/e2e/test_e2e.py --collect-only 2>&1 | head -n 30
      - name: Run e2e tests
        env:
          E2E_URL: http://127.0.0.1:8080/index.html
        run: |
          mkdir -p docs/qa
          pytest tests/e2e/test_e2e.py -v -s --tb=short 2>&1 | tee /tmp/e2e.log
          echo "=== screenshots after e2e ==="
          ls -lh docs/qa/ || echo "no docs/qa"
          echo "count $(ls -1 docs/qa/*.png 2>/dev/null | wc -l)"
      - name: Show e2e log
        if: always()
        run: cat /tmp/e2e.log | tail -n 120
      - name: Size gate — каждый PNG ≥5KB, всего 13
        if: always()
        run: |
          ls -lh docs/qa/
          echo "=== size gate ==="
          count=$(ls docs/qa/*.png 2>/dev/null | wc -l)
          echo "found $count png"
          if [ "$count" -lt 13 ]; then echo "FAIL: expected 13 PNG, found $count"; ls -R docs/qa/; exit 1; fi
          for f in docs/qa/*.png; do
            sz=$(stat -c%s "$f")
            echo "$f $sz bytes"
            if [ "$sz" -lt 5120 ]; then echo "FAIL: $f <5KB ($sz)"; exit 1; fi
          done
          echo "size gate OK"
      - name: Commit screenshots (arena only)
        if: always() && github.ref == 'refs/heads/arena/84988ed1-no-need-to-be-a-smart-aleck'
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add docs/qa/*.png || true
          if git diff --cached --quiet; then echo "no new screenshots"; else git commit -m "qa: e2e screenshots 13 png ($(ls docs/qa/*.png | wc -l) files, $(du -sh docs/qa | cut -f1))" && git push origin HEAD; fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots-${{ github.run_id }}
          path: docs/qa/
          if-no-files-found: error
          retention-days: 14

  qa-e2e-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest playwright Pillow trimesh scipy scikit-image mapbox-earcut shapely
          python -m playwright install --with-deps chromium
      - name: Start web server
        run: |
          nohup python -m http.server 8080 --directory web > /tmp/http.log 2>&1 &
          sleep 2
          curl -sI http://127.0.0.1:8080/index.html | head
      - name: Run e2e-extra 20 random real seed123
        env:
          E2E_URL: http://127.0.0.1:8080/index.html
        run: |
          mkdir -p docs/qa-extra
          pytest tests/e2e/test_e2e_extra.py -v -s --tb=short 2>&1 | tee /tmp/e2e-extra.log
          ls -lh docs/qa-extra/ || echo "no qa-extra"
      - name: Show e2e-extra log
        if: always()
        run: cat /tmp/e2e-extra.log | tail -n 100
      - name: Size gate qa-extra ≥5KB
        if: always()
        run: |
          ls -lh docs/qa-extra/
          count=$(ls docs/qa-extra/*.png 2>/dev/null | wc -l)
          echo "found $count png in qa-extra"
          if [ "$count" -lt 10 ]; then echo "FAIL qa-extra expected ≥10 PNG, found $count"; exit 1; fi
          for f in docs/qa-extra/*.png; do
            sz=$(stat -c%s "$f")
            echo "$f $sz"
            if [ "$sz" -lt 5120 ]; then echo "FAIL $f <5KB"; exit 1; fi
          done
          echo "qa-extra size gate OK"
      - name: Upload qa-extra
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-extra-${{ github.run_id }}
          path: docs/qa-extra/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit qa-extra (arena only)
        if: always() && github.ref == 'refs/heads/arena/84988ed1-no-need-to-be-a-smart-aleck'
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add docs/qa-extra/*.png || true
          if git diff --cached --quiet; then echo "no new qa-extra"; else git commit -m "qa: e2e-extra 20 png seed123" && git push origin HEAD; fi
