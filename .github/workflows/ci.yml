name: CI
on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  ci-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python deps
        run: pip install -r requirements.txt && pip install pytest mapbox-earcut shapely
      - name: Python compile
        run: python -m py_compile main.py solver.py build/vendor.py build/make_icon.py tools/fetch_corpus.py tools/make_stress_report.py tests/test_beam.py tests/test_solver.py tests/test_corpus.py tests/test_mbb.py tests/test_bracket_oc.py
      - name: Node check
        run: node --check web/js/app.js && node --check web/js/state.js
      - name: Solver import smoke
        run: python -c "import solver; print(solver.MATERIALS)"
      - name: Beam etalon (≤2%)
        run: pytest tests/test_beam.py -v
      - name: Solver smoke
        run: pytest tests/test_solver.py -v -k "not corpus"
      - name: MBB benchmark (60x20 volfrac 0.5)
        run: pytest tests/test_mbb.py -v --tb=short
      - name: Bracket OC 16³ (no collapse)
        run: pytest tests/test_bracket_oc.py -v --tb=short
      - name: All tests (beam must be present)
        run: pytest tests/ -v --tb=short --ignore=tests/e2e
