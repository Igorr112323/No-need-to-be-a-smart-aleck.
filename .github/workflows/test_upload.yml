name: Test Upload
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test content" > /tmp/test.txt
          ls -lh /tmp/test.txt
          gh release upload v1.0.0 /tmp/test.txt --clobber --repo ${{ github.repository }} || echo "gh upload failed"
          gh release view v1.0.0 --json assets --jq '.assets[].name' || echo "view failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
