name: Hash v1.0.2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release download v1.0.2 --repo ${{ github.repository }} --pattern "OpenLight.exe" --dir /tmp --clobber
          ls -lh /tmp/OpenLight.exe
          SHA=$(sha256sum /tmp/OpenLight.exe | cut -d' ' -f1)
          SZ=$(stat -c%s /tmp/OpenLight.exe)
          SZM=$(numfmt --to=iec-i --suffix=B $SZ)
          cat > /tmp/body.md <<'EOF'
          OpenLight 1.0.2 — бесплатный Windows .exe для умного облегчения 3D-деталей, офлайн.

          **Что нового в 1.0.2:**
          - Фикс лоадера: убран хардкод 86/100 → фейк-прогресс + автозакрытие 1.8с (не зависает 5 мин)
          - Титул-бар ●●● (закрыть/свернуть/развернуть), метрики сворачиваются

          **Что есть:**
          - Ядро МКЭ/SIMP: корпус 86/100 (16³→32³ 120с, ≥85% пройден), эталон балки ошибка 1.8%, MBB 60×20×1 16ит 49% 21.4с, Кирш Kt ошибка 2.5%, CalculiX cross-check 4.2% — все измерено, см. docs/CORPUS_REPORT.md, docs/VERIFICATION.md, ccx_report.md
          - Бесплатно для всех, без подписок/ключей/триалов; офлайн после vendor.py; Windows 10/11 x64 WebView2
          - STL/OBJ импорт, материал сталь/alu/PLA (PLA ортотропная), 3 случая нагрузки, единицы мм/см/дюймы, проект .olight.json

          **Чего нет:**
          - STEP — заглушка v1.1 (OCCT); buckling/потеря устойчивости, усталость, контактная задача, пластическое течение — не моделируется
          - Инженерная пригодность — оценочная, подтверждать независимым расчётом/испытанием

          См. README, docs/KNOWN_LIMITATIONS.md, LICENSE MIT. Версия из VERSION (`git describe --tags`, без хардкода), `OpenLight.exe --selftest` → `OpenLight 1.0.2`.
          EOF
          printf "\n---\n**SHA256:** \`%s\` — \`OpenLight.exe\` (%s, Build #%s)\nRelease: https://github.com/%s/releases/tag/v1.0.2\n" "$SHA" "$SZM" "${{ github.run_id }}" "${{ github.repository }}" >> /tmp/body.md
          gh release edit v1.0.2 --repo ${{ github.repository }} --notes-file /tmp/body.md
          cat /tmp/body.md | tail -n 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
