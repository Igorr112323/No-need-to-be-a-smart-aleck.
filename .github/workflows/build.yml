name: Build OpenLight.exe
on:
  push:
    tags: [ "v*" ]
    branches: [ main, "arena/**" ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: repo/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Vendor (internet once)
        run: python build/vendor.py
      - name: Make icon
        run: python build/make_icon.py
      - name: Install pyinstaller
        run: pip install pyinstaller
      - name: Build exe
        shell: cmd
        run: build_exe.bat
      - name: Size
        shell: bash
        run: ls -lh dist/OpenLight.exe || dir dist/OpenLight.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLight.exe
          path: repo/dist/OpenLight.exe
          retention-days: 14
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: repo/dist/OpenLight.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
