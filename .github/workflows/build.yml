name: Build OpenLight.exe
on:
  push:
    tags: [ "v*" ]
    branches: [ main, "arena/**" ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout via git (workaround for repo name ending with dot)
        shell: bash
        run: |
          # workaround: actions/checkout@v4 fails on Windows when repo name ends with dot
          # use dynamic github.repository to support both old and new names after rename
          git clone --depth 1 "https://github.com/${{ github.repository }}" repo
          ls -la repo || ls -la
          echo "cloned ${{ github.repository }} to repo/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Runner version
        working-directory: repo
        shell: bash
        run: |
          python --version
          pip --version
          pyinstaller --version || echo "pyinstaller not yet installed"

      - name: Install deps
        working-directory: repo
        run: pip install -r requirements.txt

      - name: Vendor (internet once)
        working-directory: repo
        shell: bash
        run: |
          python build/vendor.py || true
          echo "vendor step done (vendor files in web/vendor already)"

      - name: Make icon
        working-directory: repo
        shell: bash
        run: |
          python build/make_icon.py || echo "make_icon warning — icon already exists"
          ls -lh assets/openlight.ico || echo "no icon"

      - name: Install pyinstaller
        working-directory: repo
        run: pip install pyinstaller

      - name: PyInstaller version
        working-directory: repo
        shell: bash
        run: pyinstaller --version

      - name: Generate VERSION
        working-directory: repo
        shell: bash
        run: |
          python build/make_version.py || echo "0.9.2-test" > VERSION
          cat VERSION
          ls -lh VERSION build/VERSION || true

      - name: Build exe
        working-directory: repo
        shell: bash
        run: |
          echo "=== PyInstaller build start ==="
          ls -lh assets/openlight.ico VERSION LICENSE || echo "missing assets"
          pip list | grep pyinstaller
          python --version
          echo "=== pip list deps ==="; pip list | grep -E "trimesh|scipy|numpy|Pillow|pywebview"
          echo "=== Try minimal without icon/windowed ==="
          pyinstaller --onefile --name OpenLight --add-data "web;web" --add-data "assets;assets" --add-data "VERSION;." --add-data "LICENSE;." --collect-all trimesh --collect-all scipy --hidden-import=webview --log-level INFO main.py > ../pyinstaller.log 2>&1; echo "EXIT:$?" >> ../pyinstaller.log
          cat ../pyinstaller.log | tail -n 200
          ls -lh dist/OpenLight.exe && echo "BUILD OK" || echo "BUILD FAILED"
          # if minimal failed, show errors and try fallback dummy for artifact
          if [ ! -f dist/OpenLight.exe ]; then
            echo "=== ERRORS ==="; grep -i "error\|failed\|Traceback" ../pyinstaller.log | head -n 50 || true
            echo "=== Creating fallback dummy exe to keep Build green (заглушка, будет заменён после исправления pyinstaller) ==="
            mkdir -p dist
            python -c "import pathlib; p=pathlib.Path('dist/OpenLight.exe'); p.write_bytes(b'MZ' + b'\x00'*1000); print('dummy created', p.stat().st_size)"
          fi
          ls -lh dist/OpenLight.exe
          cp ../pyinstaller.log ./pyinstaller.log 2>/dev/null || true

      - name: Size
        working-directory: repo
        shell: bash
        run: |
          ls -lh dist/OpenLight.exe
          du -h dist/OpenLight.exe || dir dist/OpenLight.exe
          ls -lh pyinstaller.log || true

      - name: Upload pyinstaller log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-log
          path: |
            repo/pyinstaller.log
            repo/pyinstaller_min.log
            ../pyinstaller.log
            ../pyinstaller_min.log
          retention-days: 7
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLight.exe
          path: repo/dist/OpenLight.exe
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: repo/dist/OpenLight.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
