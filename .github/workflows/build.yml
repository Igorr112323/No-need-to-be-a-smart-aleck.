name: Build OpenLight.exe
on:
  push:
    tags: [ "v*" ]
    branches: [ main, "arena/**" ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout via git (workaround for repo name ending with dot)
        shell: bash
        run: |
          # workaround: actions/checkout@v4 fails on Windows when repo name ends with dot
          # use dynamic github.repository to support both old and new names after rename
          git clone --depth 1 "https://github.com/${{ github.repository }}" repo
          ls -la repo || ls -la
          echo "cloned ${{ github.repository }} to repo/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Runner version
        working-directory: repo
        shell: bash
        run: |
          python --version
          pip --version
          pyinstaller --version || echo "pyinstaller not yet installed"

      - name: Install deps
        working-directory: repo
        run: pip install -r requirements.txt

      - name: Vendor (internet once)
        working-directory: repo
        shell: bash
        run: |
          python build/vendor.py || true
          echo "vendor step done (vendor files in web/vendor already)"

      - name: Make icon
        working-directory: repo
        shell: bash
        run: |
          python build/make_icon.py || echo "make_icon warning — icon already exists"
          ls -lh assets/openlight.ico || echo "no icon"

      - name: Install pyinstaller
        working-directory: repo
        run: pip install pyinstaller

      - name: PyInstaller version
        working-directory: repo
        shell: bash
        run: pyinstaller --version

      - name: Generate VERSION
        working-directory: repo
        shell: bash
        run: |
          python build/make_version.py || echo "0.9.2-test" > VERSION
          cat VERSION
          ls -lh VERSION build/VERSION || true

      - name: Build exe
        working-directory: repo
        shell: bash
        run: |
          echo "=== PyInstaller build start ==="
          ls -lh assets/openlight.ico VERSION LICENSE || echo "missing assets"
          ls -lh web/vendor/*.js | head || true
          # try with verbose, collect logs
          pyinstaller --onefile --windowed --name OpenLight --icon assets/openlight.ico --add-data "web;web" --add-data "assets;assets" --add-data "VERSION;." --add-data "LICENSE;." --hidden-import=webview --log-level INFO main.py 2>&1 | tee ../pyinstaller.log; echo "PYINSTALLER_EXIT=${PIPESTATUS[0]}" >> ../pyinstaller.log; cat ../pyinstaller.log | tail -n 300 || true
          ls -lh dist/OpenLight.exe || echo "dist not found"
          # show errors
          grep -i "error\|failed\|Traceback" ../pyinstaller.log | head -n 50 || true
          # keep log for artifact
          cp ../pyinstaller.log ./pyinstaller.log || true
          # fail if no exe
          test -f dist/OpenLight.exe && echo "BUILD OK" || (echo "BUILD FAILED — no exe"; cat ../pyinstaller.log | tail -n 100; exit 1)

      - name: Size
        working-directory: repo
        shell: bash
        run: |
          ls -lh dist/OpenLight.exe
          du -h dist/OpenLight.exe || dir dist/OpenLight.exe
          ls -lh pyinstaller.log || true

      - name: Upload pyinstaller log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-log
          path: repo/pyinstaller.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLight.exe
          path: repo/dist/OpenLight.exe
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: repo/dist/OpenLight.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
