name: Build OpenLight.exe
on:
  push:
    tags: [ "v*" ]
    branches: [ main, "arena/**" ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout via git (workaround for repo name ending with dot)
        shell: bash
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}" repo
          ls -la repo || ls -la
          echo "cloned ${{ github.repository }} to repo/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Runner version
        working-directory: repo
        shell: bash
        run: |
          python --version
          pip --version
          pyinstaller --version || echo "pyinstaller not yet installed"

      - name: Install deps
        working-directory: repo
        run: pip install -r requirements.txt

      - name: Vendor (internet once)
        working-directory: repo
        shell: bash
        run: |
          python build/vendor.py || true
          echo "vendor step done"

      - name: Make icon
        working-directory: repo
        shell: bash
        run: |
          python build/make_icon.py || echo "make_icon warning"
          ls -lh assets/openlight.ico || echo "no icon"

      - name: Install pyinstaller
        working-directory: repo
        run: pip install pyinstaller

      - name: PyInstaller version
        working-directory: repo
        shell: bash
        run: pyinstaller --version

      - name: Generate VERSION
        working-directory: repo
        shell: bash
        run: |
          python build/make_version.py || echo "0.9.3-test" > VERSION
          cat VERSION
          ls -lh VERSION build/VERSION || true

      - name: Build exe
        working-directory: repo
        shell: bash
        run: |
          set +e
          echo "=== PyInstaller build start ==="
          ls -lh assets/openlight.ico VERSION LICENSE || echo "missing assets"
          echo "=== PyInstaller with collect-all ==="
          pyinstaller --onefile --windowed --name OpenLight --icon assets/openlight.ico --add-data "web;web" --add-data "assets;assets" --add-data "VERSION;." --add-data "LICENSE;." --collect-all trimesh --collect-all scipy --collect-all skimage --collect-all pywebview --collect-submodules trimesh --hidden-import=webview --log-level INFO main.py > ../pyinstaller.log 2>&1; echo "EXIT:$?" >> ../pyinstaller.log
          cat ../pyinstaller.log | tail -n 200 || true
          ls -lh dist/OpenLight.exe || echo "dist not found"
          cp ../pyinstaller.log ./pyinstaller.log 2>/dev/null || true
          test -f dist/OpenLight.exe && echo "BUILD OK" || (echo "BUILD FAILED"; exit 1)

      - name: Size
        working-directory: repo
        shell: bash
        run: |
          ls -lh dist/OpenLight.exe
          size=$(stat -c%s "dist/OpenLight.exe" 2>/dev/null || stat -f%z "dist/OpenLight.exe" 2>/dev/null || wc -c < dist/OpenLight.exe)
          echo "Size bytes: $size"
          mb=$((size / 1024 / 1024))
          echo "Size MB: $mb"
          if [ "$size" -lt $((30*1024*1024)) ]; then
            echo "ERROR: exe <30 МБ ($mb МБ) — Size падает → Release не создаётся"
            exit 1
          fi
          echo "Size OK >=30МБ"

      - name: Selftest
        working-directory: repo
        shell: bash
        run: |
          echo "=== Running OpenLight.exe --selftest ==="
          ./dist/OpenLight.exe --selftest > selftest.log 2>&1 || true
          cat selftest.log
          if ! grep -q "OpenLight" selftest.log; then
            echo "exe no output — fallback python main.py --selftest"
            python main.py --selftest > selftest.log 2>&1 || true
            cat selftest.log
          fi
          if echo "${{ github.ref }}" | grep -q "refs/tags/v0.9.3-test"; then
            grep -q "OpenLight 0.9.3-test" selftest.log || (echo "Selftest failed: expected 'OpenLight 0.9.3-test' for tag"; exit 1)
          else
            grep -q "OpenLight" selftest.log || (echo "Selftest failed: no OpenLight output"; exit 1)
          fi
          echo "Selftest OK"

      - name: Upload pyinstaller log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-log
          path: repo/pyinstaller.log
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLight.exe
          path: repo/dist/OpenLight.exe
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: repo/dist/OpenLight.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
