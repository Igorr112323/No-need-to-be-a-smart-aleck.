name: Hash Release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "OpenLight.exe" --dir /tmp --clobber || echo "gh download failed"
          ls -lh /tmp/OpenLight.exe || ls -lh /tmp/
          sha256sum /tmp/OpenLight.exe 2>&1 | tee /tmp/sha.txt || shasum -a 256 /tmp/OpenLight.exe 2>&1 | tee /tmp/sha.txt
          cat /tmp/sha.txt
          echo "SHA256:"
          cat /tmp/sha.txt | cut -d' ' -f1
          # also via python
          python3 -c "import hashlib,pathlib; p=pathlib.Path('/tmp/OpenLight.exe'); print(hashlib.sha256(p.read_bytes()).hexdigest())" 2>&1 | tee -a /tmp/sha.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-sha256
          path: /tmp/sha.txt
