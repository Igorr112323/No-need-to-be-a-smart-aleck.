name: Expand corpus 510→1000 реальных
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Цель записей (1000)'
        required: false
        default: '1000'
  push:
    branches: [ "arena/84988ed1-no-need-to-be-a-smart-aleck" ]
    paths:
      - 'tools/fetch_real_corpus.py'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt && pip install trimesh
      - name: Expand manifest to 1000 (только в CI, интернет есть)
        run: |
          echo "before $(cat tests/corpus/manifest.json | python3 -c 'import json; print(len(json.load(open("tests/corpus/manifest.json"))))')"
          python tools/fetch_real_corpus.py --target ${{ github.event.inputs.target || 1000 }} --seed 123
          echo "after $(cat tests/corpus/manifest.json | python3 -c 'import json; print(len(json.load(open("tests/corpus/manifest.json"))))')"
          ls -lh tests/corpus/cache/ | head -n 20
      - name: Commit manifest (если изменился)
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add tests/corpus/manifest.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "corpus: expand to 1000 реальных (whitelist, sha256 измерены, ≤15МБ)" && git push origin HEAD; fi
