name: Hash v1.0.4
on: workflow_dispatch
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release download v1.0.4 --repo ${{ github.repository }} --pattern "OpenLight.exe" --dir /tmp --clobber
          SHA=$(sha256sum /tmp/OpenLight.exe | cut -d' ' -f1)
          SZ=$(stat -c%s /tmp/OpenLight.exe)
          SZM=$(numfmt --to=iec-i --suffix=B $SZ)
          cat > /tmp/body.md <<'EOF'
          OpenLight 1.0.4 — 17E: окно кликается, светофор вправо, CTA+dragdrop, TDZ fix.

          **Что нового в 1.0.4 (фикс зависания «Инициализация…” → мёртвые кнопки):**
          - TDZ fix: `let importedGroup/Name` перенесён до `syncTitlebar/updateMetrics` — ReferenceError ломал boot и все listeners
          - Светофор ●●● перенесён в правый верхний угол (12px, hover ×−▢, `pointer-events:auto`, drag-зона не перекрывает)
          - `api_minimize/maximize/close` с fallback `ctypes ShowWindow SW_MINIMIZE(6)/SW_MAXIMIZE(3)/SW_RESTORE(9)` + лог `ui: ... clicked` в `init.log`
          - Центр `Полотно пусто` кликабелен (`pointer-events:auto`) + `dragover/drop` STL/OBJ, CTA заменён на `<kbd>Открыть</kbd> или перетащите STL`
          - `appLoader` уже с `pointer-events:none` в `.hidden` + inline fallback 2.2с/3.8с — `elementFromPoint` не ловит оверлей
          - `listeners-attached` маркер в `init.log`, `onerror→title ERR`, `__diag` boot wrapper

          **Что есть/чего нет:** как в 1.0.3 (корпус 86/100, МББ 1.8%, Кирш 2.5%, CalculiX 4.2%, офлайн, нет STEP/buckling, MIT).

          См. README, docs/KNOWN_LIMITATIONS.md, LICENSE MIT. Версия из VERSION (`git describe --tags`), `OpenLight.exe --selftest` → `OpenLight 1.0.4`.
          EOF
          printf "\n---\n**SHA256:** \`%s\` — \`OpenLight.exe\` (%s, Build #%s)\nRelease: https://github.com/%s/releases/tag/v1.0.4\nПуть к логу: `%%APPDATA%%\\OpenLight\\logs\\init.log` — `OpenLight.exe --diag`\n" "$SHA" "$SZM" "${{ github.run_id }}" "${{ github.repository }}" >> /tmp/body.md
          gh release edit v1.0.4 --repo ${{ github.repository }} --notes-file /tmp/body.md
          cat /tmp/body.md | tail -n 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
